[project]
name = "awlchemy"
version = "0.3.0"
description = "Your leathercraft pattern library with a Claude-powered teacher that turns any PDF pattern into a beginner-friendly build guide"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.13"
keywords = ["leathercraft", "leatherworking", "patterns", "pdf", "claude", "learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "claude-agent-sdk>=0.2.180",
    "fastapi>=0.162.2",
    "pymupdf>=2.1",
    "pymupdf4llm>=2.1",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
awlchemy = "awlchemy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["awlchemy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
